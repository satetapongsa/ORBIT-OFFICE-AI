# AURA OFFICE AI — reverse proxy.
# Routes /api/* to FastAPI and everything else to Next.js, so the browser only
# ever talks to one origin (first-party cookies, no CORS).
# HTTPS/TLS termination is added in Phase 9 (see docs/RUNBOOK.md).

upstream aura_backend {
    server backend:8000;
    keepalive 16;
}

upstream aura_frontend {
    server frontend:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 30m;   # keep >= UPLOAD_MAX_BYTES

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        proxy_pass http://aura_backend;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;      # AI responses can take a while
        proxy_buffering off;          # allow streamed (SSE) responses from Phase 6
    }

    location / {
        proxy_pass http://aura_frontend;
        proxy_set_header Upgrade $http_upgrade;       # Next.js dev HMR websocket
        proxy_set_header Connection $connection_upgrade;
    }
}
