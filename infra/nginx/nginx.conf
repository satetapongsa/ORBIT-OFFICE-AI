# ORBIT OFFICE AI — reverse proxy.
# Routes /api/* to FastAPI and everything else to Next.js, so the browser only
# ever talks to one origin (first-party cookies, no CORS).
# Local proxy (compose profile `proxy`); production uses nginx.prod.conf.template (HTTPS).

upstream orbit_backend {
    server backend:8000;
    keepalive 16;
}

upstream orbit_frontend {
    server frontend:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 30m;   # keep >= UPLOAD_MAX_BYTES

    # Nginx is the single source of these headers; drop the upstream copies to avoid duplicates.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx is the edge: overwrite (never append) the client address so it cannot be spoofed.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        proxy_pass http://orbit_backend;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;      # AI responses can take a while
        proxy_buffering off;          # allow streamed (SSE) responses from Phase 6
    }

    location / {
        proxy_pass http://orbit_frontend;
        proxy_set_header Upgrade $http_upgrade;       # Next.js dev HMR websocket
        proxy_set_header Connection $connection_upgrade;
    }
}
