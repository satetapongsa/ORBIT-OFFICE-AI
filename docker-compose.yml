# ORBIT OFFICE AI — local development stack.
#
#   cp .env.example .env
#   docker compose up --build            # postgres, redis, minio, migrate, backend, worker, frontend
#   docker compose --profile proxy up    # + nginx reverse proxy on http://localhost:${NGINX_PORT:-8080}
#
# Infrastructure only (run backend/frontend as local processes):
#   docker compose up -d postgres redis minio

name: orbit-office

x-backend-env: &backend-env
  # Container-network hostnames override the localhost values used by local processes.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit_dev_password}@postgres:5432/${POSTGRES_DB:-orbit_office}
  REDIS_URL: redis://redis:6379/0
  STORAGE_ENDPOINT_URL: http://minio:9000
  # Development mail goes to Mailpit (web UI http://127.0.0.1:8025); set SMTP_CONTAINER_HOST
  # to use a real server from the containers.
  SMTP_HOST: ${SMTP_CONTAINER_HOST:-mailpit}
  SMTP_PORT: ${SMTP_CONTAINER_PORT:-1025}
  SMTP_STARTTLS: ${SMTP_CONTAINER_STARTTLS:-false}

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
    target: dev
  image: orbit-office-backend:dev
  env_file:
    - path: .env
      required: false
  environment:
    <<: *backend-env
  volumes:
    - ./backend:/app
  extra_hosts:
    # Lets containers reach services on the host, e.g. Ollama at http://host.docker.internal:11434
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_office}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # Community MinIO build (pgsty), RELEASE.2026-08-04, pinned by digest because upstream
    # minio/minio images are no longer published. Override with MINIO_IMAGE (ADR-009, ADR-013).
    image: ${MINIO_IMAGE:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit-minio-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    # Local mail catcher: every e-mail the app sends in development lands here, nothing leaves
    # the machine. Pinned by digest (tag v1.27).
    image: ${MAILPIT_IMAGE:-axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  migrate:
    <<: *backend
    # Migrations, then the permission catalogue / system roles (idempotent, safe every start).
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli sync-rbac"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "-Q", "default,documents", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: dev
    image: orbit-office-frontend:dev
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true" # reliable file watching on Windows/macOS bind mounts
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  frontend-node-modules:
  frontend-next:
